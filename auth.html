<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNkY29sa29hdm93amp5bXpkenVkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njg0MDI2NjQsImV4cCI6MjA4Mzk3ODY2NH0.JPzj9fI1pKpPbPxyGqsemjcwpKiu0h046H7aBSURnpM';
        const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);
    </script>

    <style>
        :root {
            --primary: #4f46e5;
            --accent: #0ea5e9;
            --success: #10b981;
            --error: #ef4444;
            --glass: rgba(15, 23, 42, 0.75);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-muted: #94a3b8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            background: #000; 
            font-family: 'Outfit', sans-serif; 
            height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            overflow: hidden; 
            position: relative;
        }

        .bg-layer {
            position: fixed; inset: -5%; 
            background-image: url('https://images.pexels.com/photos/1268855/pexels-photo-1268855.jpeg'); 
            background-size: cover; 
            background-position: center; 
            filter: brightness(0.4);
            animation: zoomBreath 20s infinite alternate ease-in-out;
            z-index: -1;
        }
        @keyframes zoomBreath { from { transform: scale(1); } to { transform: scale(1.1); } }

        #toast-container {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            z-index: 1000; width: 90%; max-width: 400px;
            display: flex; flex-direction: column; gap: 10px;
        }
        .toast {
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid var(--glass-border);
            color: #fff; padding: 15px; border-radius: 12px;
            display: flex; align-items: center; gap: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            animation: slideDown 0.3s ease-out;
        }
        .toast.success { border-left: 4px solid var(--success); }
        .toast.error { border-left: 4px solid var(--error); }
        @keyframes slideDown { from { transform: translateY(-20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        .auth-card {
            width: 90%; max-width: 420px;
            background: var(--glass);
            backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 2.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
            position: relative;
            overflow-y: auto;
            max-height: 90vh;
        }

        .header-text { text-align: center; margin-bottom: 20px; }
        .logo { font-family: 'Syncopate', sans-serif; font-weight: 700; font-size: 1.8rem; letter-spacing: 2px; background: linear-gradient(to right, #fff, var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .subtitle { font-size: 0.85rem; color: var(--text-muted); margin-top: 5px; }

        .tab-container { display: flex; background: rgba(0,0,0,0.4); border-radius: 12px; padding: 4px; margin-bottom: 20px; }
        .tab-btn { flex: 1; padding: 10px; border: none; background: transparent; color: var(--text-muted); font-weight: 600; cursor: pointer; border-radius: 8px; transition: 0.3s; }
        .tab-btn.active { background: rgba(255,255,255,0.1); color: #fff; }

        .acc-type-label { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 8px; text-transform: uppercase; font-weight: 700; }
        .acc-selector { display: flex; gap: 10px; margin-bottom: 20px; }
        .acc-option { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 12px; border: 1px solid var(--glass-border); border-radius: 12px; cursor: pointer; transition: 0.3s; }
        .acc-option.selected { border-color: var(--accent); background: rgba(14, 165, 233, 0.1); }
        .acc-option.selected i, .acc-option.selected span { color: #fff; }

        .form-slide { display: none; animation: fadeIn 0.4s ease; }
        .form-slide.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .input-group { margin-bottom: 12px; position: relative; }
        .input-field { width: 100%; background: rgba(0,0,0,0.3); border: 1px solid var(--glass-border); padding: 14px 16px; border-radius: 12px; color: #fff; outline: none; transition: 0.3s; }
        .input-field:focus { border-color: var(--accent); background: rgba(0,0,0,0.5); }
        .input-icon { position: absolute; right: 16px; top: 50%; transform: translateY(-50%); color: var(--text-muted); cursor: pointer; }

        .action-btn { width: 100%; padding: 16px; border: none; border-radius: 12px; background: linear-gradient(135deg, var(--primary), var(--accent)); color: #fff; font-weight: 700; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        .action-btn:hover { transform: translateY(-2px); }

        .link-text { display: block; text-align: right; color: var(--text-muted); font-size: 0.8rem; margin-top: 10px; cursor: pointer; text-decoration: none; }
        .back-home { position: absolute; top: 20px; left: 20px; color: rgba(255,255,255,0.5); text-decoration: none; font-size: 0.8rem; display: flex; align-items: center; gap: 5px; }

        @media (max-width: 480px) { .auth-card { padding: 1.5rem; } }
    </style>
</head>
<body>

    <div class="bg-layer"></div>
    <div id="toast-container"></div> 
    <a href="index.html" class="back-home"><i class="fas fa-chevron-left"></i> Home</a>

    <div class="auth-card">
        <div class="header-text">
            <h1 class="logo">GoTravel</h1>
            <p class="subtitle">Experience the world, your way.</p>
        </div>

        <div class="tab-container" id="main-tabs">
            <button class="tab-btn active" onclick="setMode('login')">Login</button>
            <button class="tab-btn" onclick="setMode('signup')">Sign Up</button>
        </div>

        <div class="form-container">
            <div id="login-form" class="form-slide active">
                <form onsubmit="handleLogin(event)">
                    <div class="input-group">
                        <input type="email" id="login-email" class="input-field" placeholder="Email Address" required>
                        <i class="fas fa-envelope input-icon"></i>
                    </div>
                    <div class="input-group">
                        <input type="password" id="login-pass" class="input-field" placeholder="Password" required>
                        <i class="fas fa-eye input-icon" onclick="togglePass('login-pass', this)"></i>
                    </div>
                    <button type="submit" id="login-btn" class="action-btn">ACCESS ACCOUNT</button>
                    <a href="#" class="link-text" onclick="showForgotPassword()">Forgot Password?</a>
                </form>
            </div>

            <div id="signup-form" class="form-slide">
                <form onsubmit="initiateVerification(event)">
                    <div class="acc-type-label">Select Account Type</div>
                    <div class="acc-selector">
                        <div class="acc-option selected" id="opt-personal" onclick="selectAccType('personal')">
                            <i class="fas fa-user"></i><span style="font-size: 0.7rem;">Personal</span>
                        </div>
                        <div class="acc-option" id="opt-business" onclick="selectAccType('business')">
                            <i class="fas fa-briefcase"></i><span style="font-size: 0.7rem;">Business</span>
                        </div>
                    </div>
                    <input type="hidden" id="selected-acc-type" value="personal">
                    <div style="display:flex; gap:10px;">
                        <input type="text" id="reg-fname" class="input-field" placeholder="First Name" required>
                        <input type="text" id="reg-lname" class="input-field" placeholder="Last Name" required>
                    </div><br>
                    <div class="input-group">
                        <input type="email" id="reg-email" class="input-field" placeholder="Email Address" required>
                    </div>
                    <div class="input-group">
                        <input type="password" id="reg-pass" class="input-field" placeholder="Create Password" required>
                        <i class="fas fa-eye input-icon" onclick="togglePass('reg-pass', this)"></i>
                    </div>
                    <button type="submit" id="signup-btn" class="action-btn">CREATE & VERIFY</button>
                </form>
            </div>

            <div id="forgot-form" class="form-slide">
                <h3 style="text-align:center; color:#fff; margin-bottom:10px;">Reset Password</h3>
                <p style="text-align:center; font-size:0.8rem; color:var(--text-muted); margin-bottom:20px;">We will send a recovery link to your email.</p>
                <form onsubmit="sendResetLink(event)">
                    <div class="input-group">
                        <input type="email" id="reset-email" class="input-field" placeholder="Your Email Address" required>
                    </div>
                    <button type="submit" id="reset-btn" class="action-btn">SEND RECOVERY LINK</button>
                    <a href="#" class="link-text" style="text-align:center;" onclick="setMode('login')">Back to Login</a>
                </form>
            </div>

            <div id="new-pass-form" class="form-slide">
                <h3 style="text-align:center; color:#fff; margin-bottom:10px;">New Password</h3>
                <form onsubmit="updatePassword(event)">
                    <div class="input-group">
                        <input type="password" id="new-pass" class="input-field" placeholder="New Password" required>
                        <i class="fas fa-eye input-icon" onclick="togglePass('new-pass', this)"></i>
                    </div>
                    <div class="input-group">
                        <input type="password" id="confirm-pass" class="input-field" placeholder="Confirm Password" required>
                    </div>
                    <button type="submit" id="update-pass-btn" class="action-btn">UPDATE & LOGIN</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        // Check for recovery link on page load
        window.onload = function() {
            if (window.location.hash.includes('type=recovery')) {
                document.querySelectorAll('.form-slide').forEach(s => s.classList.remove('active'));
                document.getElementById('main-tabs').style.display = 'none';
                document.getElementById('new-pass-form').classList.add('active');
                showToast("Identity verified. Set your new password.", "success");
            }
        };

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `<i class="fas ${type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle'}"></i><span class="toast-msg">${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 300); }, 3000);
        }

        function setMode(mode) {
            document.getElementById('main-tabs').style.display = 'flex';
            document.querySelectorAll('.form-slide').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            if (mode === 'login') {
                document.getElementById('login-form').classList.add('active');
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
            } else {
                document.getElementById('signup-form').classList.add('active');
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
            }
        }

        function showForgotPassword() {
            document.getElementById('main-tabs').style.display = 'none';
            document.querySelectorAll('.form-slide').forEach(s => s.classList.remove('active'));
            document.getElementById('forgot-form').classList.add('active');
        }

        function togglePass(id, icon) {
            const input = document.getElementById(id);
            input.type = input.type === 'password' ? 'text' : 'password';
            icon.classList.toggle('fa-eye'); icon.classList.toggle('fa-eye-slash');
        }

        function selectAccType(type) {
            document.getElementById('selected-acc-type').value = type;
            document.getElementById('opt-personal').classList.toggle('selected', type === 'personal');
            document.getElementById('opt-business').classList.toggle('selected', type === 'business');
        }

        // --- AUTH LOGIC ---

        async function handleLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('login-btn');
            btn.innerText = "AUTHENTICATING...";
            try {
                const { data, error } = await supabaseClient.auth.signInWithPassword({
                    email: document.getElementById('login-email').value,
                    password: document.getElementById('login-pass').value,
                });
                if (error) throw error;

                const { data: userData } = await supabaseClient.from('users').select('*').eq('email', data.user.email).single();
                localStorage.setItem('userFName', userData.first_name);
                window.location.href = userData.account_type === 'business' ? "business.html" : "personal.html";
            } catch (error) {
                btn.innerText = "ACCESS ACCOUNT";
                showToast(error.message, "error");
            }
        }

        async function sendResetLink(e) {
            e.preventDefault();
            const btn = document.getElementById('reset-btn');
            const email = document.getElementById('reset-email').value;
            btn.innerText = "SENDING...";
            
            const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
                redirectTo: 'https://hsg-official.github.io/GoTravel/auth.html',
            });

            if (error) {
                showToast(error.message, "error");
                btn.innerText = "SEND RECOVERY LINK";
            } else {
                showToast("Check your email for the reset link!", "success");
                btn.innerText = "LINK SENT";
            }
        }

        async function updatePassword(e) {
            e.preventDefault();
            const newPass = document.getElementById('new-pass').value;
            if (newPass !== document.getElementById('confirm-pass').value) {
                return showToast("Passwords do not match", "error");
            }

            const btn = document.getElementById('update-pass-btn');
            btn.innerText = "UPDATING...";

            const { error } = await supabaseClient.auth.updateUser({ password: newPass });

            if (error) {
                showToast(error.message, "error");
                btn.innerText = "UPDATE & LOGIN";
            } else {
                showToast("Password updated successfully!", "success");
                setTimeout(() => setMode('login'), 2000);
            }
        }

        // Signup Logic (Uses EmailJS for the front-end code, then Supabase)
        async function initiateVerification(e) {
            e.preventDefault();
            // ... (Your existing EmailJS signup logic goes here)
        }
    </script>
</body>
</html>
