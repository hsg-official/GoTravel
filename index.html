<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoTravel | Premium Experience</title>
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@700&family=Inter:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --accent: #3b82f6;
            --glass: rgba(255, 255, 255, 0.08);
            --border: rgba(255, 255, 255, 0.15);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #000;
            color: #fff;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            height: 100vh;
        }

        /* --- 1. MINIMALIST ZOOM INTRO --- */
        #intro-screen {
            position: fixed;
            inset: 0;
            background: #050505;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: transform 1.2s cubic-bezier(0.8, 0, 0.2, 1);
        }

        .reveal-text {
            font-family: 'Syncopate', sans-serif;
            font-size: clamp(2rem, 8vw, 5rem);
            letter-spacing: 20px;
            text-transform: uppercase;
            opacity: 0;
            transform: scale(1.2);
            filter: blur(20px);
            animation: cinematicReveal 2.5s ease-out forwards;
        }

        @keyframes cinematicReveal {
            to { opacity: 1; transform: scale(1); filter: blur(0); letter-spacing: 12px; }
        }

        .slide-left { transform: translateX(-100%); }

        /* --- 2. THE BACKGROUND FIX (DUAL LAYER) --- */
        .bg-container {
            position: fixed;
            inset: 0;
            z-index: -2;
            background: #111;
        }

        .bg-layer {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center;
            transition: opacity 2s ease-in-out;
            opacity: 0;
        }

        .bg-layer.active { opacity: 1; }

        .overlay {
            position: fixed;
            inset: 0;
            background: linear-gradient(to bottom, rgba(0,0,0,0.3), rgba(0,0,0,0.85));
            z-index: -1;
        }

        /* --- 3. UI LAYOUT --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 40px 60px;
            position: relative;
            z-index: 10;
        }

        .glass-widget {
            background: var(--glass);
            backdrop-filter: blur(25px);
            padding: 20px 30px;
            border-radius: 20px;
            border: 1px solid var(--border);
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }

        .time-text { font-size: 1.8rem; font-weight: 700; color: var(--accent); display: block; }
        .date-text { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 2px; opacity: 0.6; }

        .weather-info { text-align: right; }
        .weather-info i { color: #fbbf24; margin-right: 8px; }

        .auth-btn {
            background: #fff;
            color: #000;
            padding: 12px 30px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.8rem;
            text-transform: uppercase;
            transition: 0.4s;
            border: 2px solid transparent;
        }

        .auth-btn:hover {
            background: transparent;
            color: #fff;
            border-color: #fff;
            box-shadow: 0 0 20px rgba(255,255,255,0.2);
        }

        /* --- 4. NAVIGATION --- */
        .main-nav {
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            z-index: 10;
        }

        .nav-card {
            text-decoration: none;
            color: #fff;
            width: 130px;
            height: 150px;
            background: var(--glass);
            backdrop-filter: blur(15px);
            border: 1px solid var(--border);
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: 0.5s cubic-bezier(0.23, 1, 0.32, 1);
        }

        .nav-card i { font-size: 2rem; margin-bottom: 15px; transition: 0.3s; }
        .nav-card span { font-size: 0.7rem; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }

        .nav-card:hover {
            background: var(--accent);
            transform: translateY(-20px) scale(1.05);
            border-color: rgba(255,255,255,0.4);
        }

        .nav-card:hover i { transform: scale(1.2); color: #fff; }
    </style>
</head>
<body>

    <div id="intro-screen">
        <div class="reveal-text">GoTravel</div>
    </div>

    <div id="home-screen" style="opacity: 0;">
        <div class="bg-container">
            <div id="bg1" class="bg-layer active"></div>
            <div id="bg2" class="bg-layer"></div>
        </div>
        <div class="overlay"></div>

        <header>
            <div class="glass-widget">
                <span class="time-text" id="time">00:00</span>
                <span class="date-text" id="date">MONDAY, JAN 12</span>
            </div>

            <div class="glass-widget weather-info">
                <div style="font-size: 1.2rem; font-weight: 700;">
                    <i class="fas fa-sun" id="w-icon"></i> <span id="temp">28°C</span>
                </div>
                <div id="w-msg" style="font-size: 0.7rem; opacity: 0.7; margin-top: 5px;">Skies are looking clear.</div>
            </div>

            <a href="#" class="auth-btn">Login/Sign UP</a>
        </header>

        <nav class="main-nav">
            <a href="places.html" class="nav-card"><i class="fas fa-mountain-sun"></i><span>Places</span></a>
            <a href="buses.html" class="nav-card"><i class="fas fa-bus-simple"></i><span>Buses</span></a>
            <a href="hotels.html" class="nav-card"><i class="fas fa-hotel"></i><span>Hotels</span></a>
            <a href="guides.html" class="nav-card"><i class="fas fa-user-check"></i><span>Guides</span></a>
            <a href="restaurants.html" class="nav-card"><i class="fas fa-plate-wheat"></i><span>Dining</span></a>
        </nav>
    </div>

    <script>
        // 1. Intro Logic
        window.addEventListener('load', () => {
            setTimeout(() => {
                document.getElementById('intro-screen').classList.add('slide-left');
                document.getElementById('home-screen').style.opacity = '1';
            }, 3000);
        });

        // 2. FIXED Background Logic (Dual-Layer)
        const myImages = [
            'https://images.pexels.com/photos/24698/pexels-photo-24698.jpg',
            'https://images.pexels.com/photos/322437/pexels-photo-322437.jpeg',
            'https://images.pexels.com/photos/1450372/pexels-photo-1450372.jpeg'
        ];
        
        let currentIdx = 0;
        const layers = [document.getElementById('bg1'), document.getElementById('bg2')];
        let activeLayer = 0;

        function changeBackground() {
            const nextIdx = (currentIdx + 1) % myImages.length;
            const inactiveLayer = (activeLayer + 1) % 2;

            // Load next image into the hidden layer
            layers[inactiveLayer].style.backgroundImage = `url('${myImages[nextIdx]}')`;
            
            // Wait a moment for browser to "see" the image, then swap
            setTimeout(() => {
                layers[activeLayer].classList.remove('active');
                layers[inactiveLayer].classList.add('active');
                activeLayer = inactiveLayer;
                currentIdx = nextIdx;
            }, 100); 
        }

        // Initial set
        layers[0].style.backgroundImage = `url('${myImages[0]}')`;
        setInterval(changeBackground, 6000);

        // 3. Time/Date Logic
        function updateClock() {
            const now = new Date();
            document.getElementById('time').innerText = now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            document.getElementById('date').innerText = now.toLocaleDateString([], {weekday: 'long', month: 'short', day: 'numeric'}).toUpperCase();
        }
        setInterval(updateClock, 1000);
        updateClock();

        // 4. Randomized Weather Messages
        const weatherOptions = [
            {t: "31°C", i: "fa-sun", m: "Perfect for outdoor exploration."},
            {t: "24°C", i: "fa-cloud-sun", m: "A pleasant day for travel."},
            {t: "19°C", i: "fa-cloud-rain", m: "Cool breeze and light showers."}
        ];
        const choice = weatherOptions[Math.floor(Math.random() * weatherOptions.length)];
        document.getElementById('temp').innerText = choice.t;
        document.getElementById('w-icon').className = `fas ${choice.i}`;
        document.getElementById('w-msg').innerText = choice.m;

    </script>
</body>
</html>
