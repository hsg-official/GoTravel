<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoTravel | Explore the World</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #3b82f6;
            --accent: #60a5fa;
            --glass: rgba(0, 0, 0, 0.6);
        }

        body, html {
            margin: 0; padding: 0;
            font-family: 'Poppins', sans-serif;
            background: #000; color: white;
            overflow: hidden;
        }

        /* --- 1. TYPEWRITER INTRO --- */
        #intro-screen {
            position: fixed;
            width: 100%; height: 100vh;
            background: #0f172a;
            display: flex; justify-content: center; align-items: center;
            z-index: 1000;
            transition: transform 1.2s cubic-bezier(1, 0, 0, 1);
        }

        .typewriter-text {
            font-size: 4.5rem;
            font-weight: 700;
            color: #fff;
            border-right: 4px solid var(--primary);
            white-space: nowrap;
            overflow: hidden;
            width: 0; /* Starting width */
            animation: typing 2s steps(8, end) forwards, blink 0.8s infinite;
        }

        @keyframes typing {
            from { width: 0 }
            to { width: 330px; } /* Adjust width based on text length */
        }

        @keyframes blink {
            50% { border-color: transparent }
        }

        .slide-left { transform: translateX(-100%); }

        /* --- 2. HOME SCREEN --- */
        #home-screen {
            height: 100vh; width: 100%;
            position: relative; opacity: 0;
            transition: opacity 1s ease-in;
        }

        /* Background Slider */
        .bg-slider {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            background-size: cover;
            background-position: center;
            transition: background-image 2s ease-in-out;
        }

        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(0,0,0,0.2), rgba(0,0,0,0.7));
            z-index: 0;
        }

        /* Top Bar: Widgets & Auth */
        header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 30px 50px;
            position: relative; z-index: 10;
        }

        .widgets-container {
            display: flex; gap: 20px;
        }

        .widget-card {
            background: var(--glass);
            backdrop-filter: blur(15px);
            padding: 15px 25px;
            border-radius: 15px;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .widget-card h2 { margin: 0; font-size: 1.2rem; color: var(--accent); }
        .widget-card p { margin: 5px 0 0; font-size: 0.9rem; }

        .auth-buttons button {
            background: var(--primary);
            color: white; border: none;
            padding: 12px 30px; border-radius: 30px;
            cursor: pointer; font-weight: bold;
            margin-left: 10px; transition: 0.3s;
        }

        .auth-buttons button:hover { background: var(--accent); transform: scale(1.05); }

        /* Main Menu Navigation */
        .nav-container {
            position: absolute; bottom: 10%; width: 100%;
            display: flex; justify-content: center; gap: 15px;
            z-index: 10;
        }

        .nav-item {
            background: var(--glass);
            backdrop-filter: blur(10px);
            padding: 25px; width: 140px;
            text-align: center; border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.1);
            text-decoration: none; color: white;
            transition: all 0.4s ease;
        }

        .nav-item i { font-size: 1.8rem; margin-bottom: 10px; display: block; }
        .nav-item span { font-weight: 500; font-size: 0.9rem; }

        .nav-item:hover {
            background: var(--primary);
            transform: translateY(-15px);
            box-shadow: 0 15px 30px rgba(59, 130, 246, 0.4);
        }
    </style>
</head>
<body>

    <div id="intro-screen">
        <div class="typewriter-text">GoTravel</div>
    </div>

    <div id="home-screen">
        <div class="bg-slider" id="bgSlider"></div>
        <div class="overlay"></div>

        <header>
            <div class="widgets-container">
                <div class="widget-card">
                    <h2><i class="far fa-clock"></i> <span id="time">00:00</span></h2>
                    <p id="date">Loading Date...</p>
                </div>
                <div class="widget-card">
                    <h2 id="weather-temp"><i class="fas fa-cloud-sun"></i> 28°C</h2>
                    <p id="weather-desc">Sunny - Perfect for travel!</p>
                </div>
            </div>

            <div class="auth-buttons">
                <button>Login</button>
                <button style="background: rgba(255,255,255,0.1); border: 1px solid white;">Sign Up</button>
            </div>
        </header>

        <nav class="nav-container">
            <a href="places.html" class="nav-item">
                <i class="fas fa-map-marked-alt"></i>
                <span>Places</span>
            </a>
            <a href="buses.html" class="nav-item">
                <i class="fas fa-bus"></i>
                <span>Buses</span>
            </a>
            <a href="hotels.html" class="nav-item">
                <i class="fas fa-hotel"></i>
                <span>Hotels</span>
            </a>
            <a href="guides.html" class="nav-item">
                <i class="fas fa-user-tie"></i>
                <span>Guides</span>
            </a>
            <a href="restaurants.html" class="nav-item">
                <i class="fas fa-utensils"></i>
                <span>Food</span>
            </a>
        </nav>
    </div>

    <script>
        // 1. INTRO TRANSITION
        window.addEventListener('load', () => {
            setTimeout(() => {
                document.getElementById('intro-screen').classList.add('slide-left');
                document.getElementById('home-screen').style.opacity = '1';
            }, 3500); // Gives time for the "typing" to finish
        });

        // 2. MANUAL BACKGROUND IMAGES
        // Update these strings with your local file paths (e.g., 'images/bali.jpg')
        const myImages = [
            'https://images.unsplash.com/photo-1506744038136-46273834b3fb?q=80&w=2070',
            'https://images.unsplash.com/photo-1476514525535-07fb3b4ae5f1?q=80&w=2070',
            'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?q=80&w=2073'
        ];
        
        let currentIdx = 0;
        const slider = document.getElementById('bgSlider');

        function rotateBg() {
            slider.style.backgroundImage = `url('${myImages[currentIdx]}')`;
            currentIdx = (currentIdx + 1) % myImages.length;
        }
        setInterval(rotateBg, 5000);
        rotateBg();

        // 3. TIME & DATE LOGIC
        function updateClock() {
            const now = new Date();
            const timeOptions = { hour: '2-digit', minute: '2-digit', second: '2-digit' };
            const dateOptions = { weekday: 'long', month: 'short', day: 'numeric' };
            
            document.getElementById('time').innerText = now.toLocaleTimeString([], timeOptions);
            document.getElementById('date').innerText = now.toLocaleDateString([], dateOptions);
        }
        setInterval(updateClock, 1000);
        updateClock();

        // 4. ATTRACTIVE WEATHER LOGIC
        const moods = [
            { temp: "31°C", desc: "Clear Sky", icon: "fa-sun", msg: "Get out and explore!" },
            { temp: "24°C", desc: "Rainy", icon: "fa-cloud-showers-heavy", msg: "Carry an umbrella today." },
            { temp: "27°C", desc: "Cloudy", icon: "fa-cloud", msg: "Great for a city walk." }
        ];
        const randomMood = moods[Math.floor(Math.random() * moods.length)];
        document.getElementById('weather-temp').innerHTML = `<i class="fas ${randomMood.icon}"></i> ${randomMood.temp}`;
        document.getElementById('weather-desc').innerText = `${randomMood.desc} - ${randomMood.msg}`;

    </script>
</body>
</html>
