<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoTravel | Responsive Experience</title>
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --accent: #3b82f6;
            --glass: rgba(0, 0, 0, 0.55);
            --border: rgba(255, 255, 255, 0.15);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #000;
            color: #fff;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden; /* Prevent horizontal scroll */
            height: 100vh;
        }

        /* --- 1. INTRO --- */
        #intro-screen {
            position: fixed;
            inset: 0;
            background: #050505;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: transform 1.2s cubic-bezier(0.8, 0, 0.2, 1);
        }

        .reveal-text {
            font-family: 'Syncopate', sans-serif;
            font-size: clamp(1.5rem, 5vw, 5rem); /* Responsive text size */
            letter-spacing: 10px;
            text-transform: uppercase;
            text-align: center;
            animation: cinematicReveal 2.5s ease-out forwards;
        }

        @keyframes cinematicReveal {
            0% { opacity: 0; transform: scale(1.2); filter: blur(20px); }
            100% { opacity: 1; transform: scale(1); filter: blur(0); letter-spacing: clamp(5px, 2vw, 12px); }
        }

        .slide-left { transform: translateX(-100%); }

        /* --- 2. BACKGROUND SLIDER --- */
        .bg-container { position: fixed; inset: 0; z-index: -2; background: #000; }
        .bg-layer { position: absolute; inset: 0; background-size: cover; background-position: center; transition: opacity 2s; opacity: 0; }
        .bg-layer.active { opacity: 1; }
        .overlay { position: fixed; inset: 0; background: radial-gradient(circle, transparent, rgba(0,0,0,0.85)); z-index: -1; }

        /* --- 3. HEADER (RESPONSIVE) --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 20px;
            position: relative;
            z-index: 10;
        }

        .info-panel {
            background: var(--glass);
            backdrop-filter: blur(20px);
            padding: 15px 20px;
            border-radius: 15px;
            border: 1px solid var(--border);
        }

        .time-text { font-size: 1.5rem; font-weight: 700; color: var(--accent); }
        .date-text { font-size: 0.7rem; letter-spacing: 1px; opacity: 0.6; display: block; }

        .auth-btn {
            background: #fff;
            color: #000;
            padding: 10px 20px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.7rem;
            text-transform: uppercase;
        }

        /* --- 4. HERO SECTION --- */
        .hero-section {
            position: absolute;
            top: 35%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            width: 90%;
            z-index: 5;
            opacity: 0;
            transition: opacity 1.5s ease 0.8s;
        }

        .hero-title {
            font-family: 'Syncopate', sans-serif;
            font-size: clamp(2rem, 8vw, 4.5rem);
            margin-bottom: 10px;
        }

        .hero-description {
            font-size: clamp(0.85rem, 2vw, 1rem);
            max-width: 500px;
            margin: 0 auto;
            line-height: 1.5;
            opacity: 0.8;
        }

        /* --- 5. NAVIGATION (RESPONSIVE) --- */
        .main-nav {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            width: 95%;
            justify-content: center;
            flex-wrap: wrap; /* Allows icons to wrap on small screens */
            z-index: 10;
        }

        .nav-card {
            text-decoration: none;
            color: #fff;
            background: var(--glass);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: 0.3s;
            /* Default for PC */
            width: 110px;
            height: 120px;
        }

        .nav-card i { font-size: 1.5rem; margin-bottom: 8px; color: var(--accent); }
        .nav-card span { font-size: 0.65rem; font-weight: 600; text-transform: uppercase; }

        .nav-card:hover { background: var(--accent); transform: translateY(-5px); }

        /* --- MOBILE & TABLET MEDIA QUERIES --- */
        @media (max-width: 768px) {
            header { padding: 15px; }
            .hero-section { top: 40%; }
            .main-nav { bottom: 20px; gap: 8px; }
            .nav-card { width: 85px; height: 100px; }
            .nav-card i { font-size: 1.2rem; }
        }

        @media (max-width: 480px) {
            .nav-card { width: 70px; height: 85px; }
            .nav-card span { font-size: 0.55rem; }
            .info-panel { padding: 10px 15px; }
            .time-text { font-size: 1.2rem; }
        }
    </style>
</head>
<body>

    <div id="intro-screen">
        <div class="reveal-text">GoTravel</div>
    </div>

    <div id="home-screen" style="opacity: 0;">
        <div class="bg-container">
            <div id="bg1" class="bg-layer active"></div>
            <div id="bg2" class="bg-layer"></div>
        </div>
        <div class="overlay"></div>

        <header>
            <div class="info-panel">
                <span id="time" class="time-text">00:00</span>
                <span id="date" class="date-text">DATE</span>
                <div style="font-size: 0.8rem; margin-top: 5px;">
                    <i class="fas fa-sun" style="color: #fbbf24;"></i> <span id="temp">28°C</span>
                </div>
            </div>
            <a href="auth.html" class="auth-btn">Account</a>
        </header>

        <div class="hero-section" id="hero">
            <h1 class="hero-title">GoTravel</h1>
            <p class="hero-description">Experience your ultimate adventure with a single click.</p>
        </div>

        <nav class="main-nav">
            <a href="places.html" class="nav-card"><i class="fas fa-mountain-sun"></i><span>Places</span></a>
            <a href="buses.html" class="nav-card"><i class="fas fa-bus"></i><span>Buses</span></a>
            <a href="hotels.html" class="nav-card"><i class="fas fa-hotel"></i><span>Hotels</span></a>
            <a href="guides.html" class="nav-card"><i class="fas fa-user-check"></i><span>Guides</span></a>
            <a href="restaurants.html" class="nav-card"><i class="fas fa-utensils"></i><span>Dining</span></a>
        </nav>
    </div>

    <script>
        window.addEventListener('load', () => {
            setTimeout(() => {
                document.getElementById('intro-screen').classList.add('slide-left');
                document.getElementById('home-screen').style.opacity = '1';
                document.getElementById('hero').style.opacity = '1';
            }, 3000);
        });

        const myImages = [
            'https://images.pexels.com/photos/35606862/pexels-photo-35606862.jpeg',
            'https://images.pexels.com/photos/322437/pexels-photo-322437.jpeg',
            'https://images.pexels.com/photos/2403209/pexels-photo-2403209.jpeg'
        ];
        
        let currentIdx = 0;
        const layers = [document.getElementById('bg1'), document.getElementById('bg2')];
        let activeLayerIdx = 0;

        function updateSlider() {
            const nextIdx = (currentIdx + 1) % myImages.length;
            const nextLayerIdx = (activeLayerIdx + 1) % 2;
            layers[nextLayerIdx].style.backgroundImage = `url('${myImages[nextIdx]}')`;
            setTimeout(() => {
                layers[activeLayerIdx].classList.remove('active');
                layers[nextLayerIdx].classList.add('active');
                activeLayerIdx = nextLayerIdx;
                currentIdx = nextIdx;
            }, 200); 
        }

        layers[0].style.backgroundImage = `url('${myImages[0]}')`;
        setInterval(updateSlider, 6000);

        function startClock() {
            const now = new Date();
            document.getElementById('time').innerText = now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            document.getElementById('date').innerText = now.toLocaleDateString([], {weekday: 'short', month: 'short', day: 'numeric'});
        }
        setInterval(startClock, 1000);
        startClock();
    </script>
</body>
</html>
