<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GoTravel | Cabs & Transport</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    >

    <link rel="stylesheet" href="../css/cabs_style.css?v=reviews3">
</head>

<body>
    <header>
        <div>
            <strong id="time"></strong>
            <span id="date"></span>
        </div>

        <a class="back-btn" href="../index.html">
            <i class="fas fa-arrow-left" aria-hidden="true"></i>
            Back
        </a>
    </header>

    <main>
        <div class="page-title-section">
            <p class="eyebrow">EXPLORE SRI LANKA</p>
            <h1>Cabs & Transport</h1>
            <p>Find a service. Explore the vehicles. Plan your ride.</p>
        </div>

        <div class="filter-bar">
            <label class="search-label">
                Search services

                <input
                    id="searchInput"
                    type="search"
                    placeholder="Service name or location"
                >
            </label>

            <label>
                Vehicle category

                <select id="categoryFilter">
                    <option value="all">All vehicles</option>
                </select>
            </label>

            <label>
                Sort by

                <select id="sortSelect">
                    <option value="default">Default</option>
                    <option value="name_asc">Name: A to Z</option>
                </select>
            </label>
        </div>

        <p id="resultsCount" role="status"></p>

        <div id="loader" role="status">
            Finding available rides…
        </div>

        <div class="cabs-grid" id="cabsGrid"></div>
    </main>

    <!-- SERVICE DETAILS -->
    <dialog id="detailsModal" aria-labelledby="detailsTitle">
        <div class="dialog-header">
            <p class="eyebrow">TRANSPORT SERVICE</p>

            <button
                type="button"
                class="close-btn"
                data-close="detailsModal"
                aria-label="Close service details"
            >
                &times;
            </button>
        </div>

        <div id="detailsContent"></div>
    </dialog>

    <!-- EXISTING TRIP SELECTION -->
    <dialog id="bookingModal" aria-labelledby="bookingTitle">
        <div class="dialog-header">
            <h2 id="bookingTitle">Add to My Trip</h2>

            <button
                type="button"
                class="close-btn"
                data-close="bookingModal"
                aria-label="Close trip selection"
            >
                &times;
            </button>
        </div>

        <p id="modalCabName"></p>

        <p class="muted">
            This saves your transport choice. Contact the service to
            confirm availability and the final price.
        </p>

        <label>
            Select your trip
            <select id="tripSelect"></select>
        </label>

        <p id="bookingStatus" role="status"></p>

        <button
            type="button"
            class="primary-btn"
            id="confirmBtn"
            disabled
        >
            Add to My Trip
        </button>
    </dialog>

    <div
        id="toast-container"
        role="status"
        aria-live="polite"
    ></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
   <script src="../backend/cabs_script.js?v=reviews3"></script>
</body>
</html>
