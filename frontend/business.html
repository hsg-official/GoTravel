<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GoTravel | Business Dashboard</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --accent:#38bdf8;
  --glass:rgba(186,230,253,0.18);
  --border:rgba(186,230,253,0.28);
  --bg:#020617;
}

*{box-sizing:border-box}


body{
  margin:0;
  min-height:100vh;
  font-family:'Inter',system-ui;
  color:#fff;
  display:flex;
  background:#000;
  overflow-x:hidden;
}
/* ===== BUSINESS BACKGROUND IMAGE ===== */
.bg-layer{
  position: fixed;
  inset: -5%;
  background-image: url('https://images.pexels.com/photos/3184291/pexels-photo-3184291.jpeg');
  background-size: cover;
  background-position: center;
  filter: brightness(0.45);
  animation: zoomBreath 20s infinite alternate ease-in-out;
  z-index: -1;
}

@keyframes zoomBreath {
  from { transform: scale(1); }
  to   { transform: scale(1.1); }
}

/* ===== SIDEBAR ===== */
.sidebar{
  width:260px;
  height:100vh;
  background:linear-gradient(
    180deg,
    rgba(1, 32, 47, 0.45),   /* darker sky blue */
    rgba(2,132,199,0.28)
  );
  backdrop-filter:blur(20px);
  border-right:1px solid rgba(186,230,253,0.35);
}


.logo{
  display:flex;
  align-items:center;
  gap:12px;
  font-size:1.2rem;
  font-weight:700;
  color:var(--accent);
  margin-bottom:35px;
}

.nav{
  display:flex;
  flex-direction:column;
  gap:6px;
}

.nav a{
  text-decoration:none;
  color:#cbd5e1;
  padding:12px 14px;
  border-radius:14px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  transition:.3s;
  font-size:.95rem;
  cursor:pointer;
}

.nav a:hover{
  background:rgba(56,189,248,.15);
  color:#fff;
}

.nav a.active{
  background:linear-gradient(135deg,rgba(56,189,248,.35),rgba(56,189,248,.15));
  color:#fff;
}

.section-title{
  margin:20px 0 8px;
  font-size:.7rem;
  letter-spacing:1px;
  text-transform:uppercase;
  opacity:.6;
}

.submenu{
  margin-left:12px;
  margin-top:6px;
  display:flex;        /* ✅ allow flex */
  flex-direction:column;
  gap:4px;
}

.submenu a{
  padding:10px 14px;
  font-size:.9rem;
  background:rgba(56,189,248,.08);
  border-radius:12px;
}

/* ===== MAIN ===== */
.main{flex:1}

/* ===== HEADER ===== */
header{
  padding:22px 5%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  backdrop-filter:blur(25px);
  background:rgba(0,0,0,0.45);
  border-bottom:1px solid var(--border);
}

h1{font-size:1.7rem}

/* ===== CONTENT ===== */
.container{
  max-width:1200px;
  margin:auto;
  padding:30px 5%;
}

/* ===== TABS ===== */
.tabs{
  display:flex;
  gap:30px;
  margin-bottom:25px;
  border-bottom:1px solid rgba(255,255,255,.15);
}

.tab-active{
  padding-bottom:10px;
  border-bottom:2px solid var(--accent);
  color:var(--accent);
  font-weight:600;
}

/* ===== CARD ===== */
.card{
  background:linear-gradient(
    180deg,
    rgba(224,242,254,0.28),
    rgba(186,230,253,0.14)
  );
  backdrop-filter:blur(34px) saturate(190%);
  border:1px solid var(--border);
  border-radius:24px;
  padding:24px;
  margin-bottom:25px;
  box-shadow:0 25px 60px rgba(14,165,233,0.35);
}

/* ===== GRID ===== */
.flex{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
  gap:20px;
}

/* ===== SERVICE CARD ===== */
.service-box{
  background:rgba(186,230,253,0.16);
  border:1px solid rgba(186,230,253,0.35);
  border-radius:18px;
  padding:20px;
  cursor:pointer;
  transition:.3s;
}
.service-box:hover{
  transform:translateY(-6px);
  box-shadow:0 20px 40px rgba(56,189,248,.35);
}
.service-box b{display:block}

/* ===== BUTTON ===== */
button{
  background:linear-gradient(135deg,var(--accent),#0ea5e9);
  border:none;
  color:#fff;
  padding:14px 20px;
  border-radius:14px;
  cursor:pointer;
  font-weight:700;
}
/* ===== FORM STYLING (CLEAN) ===== */
form{
  margin-top:20px;
}

.form-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
  gap:16px;
}

label{
  font-size:.75rem;
  opacity:.7;
  margin-bottom:6px;
  display:block;
}

input, textarea, select{
  width:100%;
  padding:14px 16px;
  background:rgba(186,230,253,0.18);
  border:1px solid rgba(186,230,253,0.35);
  border-radius:14px;
  color:#fff;
  outline:none;
  transition:.3s;
  font-size:.9rem;
}

textarea{
  resize:none;
  min-height:90px;
}

input:focus,
textarea:focus,
select:focus{
  border-color:var(--accent);
  box-shadow:0 0 0 2px rgba(56,189,248,.35);
}

.form-actions{
  display:flex;
  justify-content:flex-end;
  margin-top:20px;
}
/* ===== PROFILE ICON ===== */
.profile{
  position:relative;
  width:42px;
  height:42px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  background:linear-gradient(
    135deg,
    rgba(56,189,248,.35),
    rgba(56,189,248,.15)
  );
  border:1px solid rgba(56,189,248,.45);
}

.profile i{
  font-size:18px;
  color:#fff;
}

/* Tooltip */
.profile-tooltip{
  position:absolute;
  top:52px;
  right:0;
  background:rgba(2, 18, 85, 0.95);
  border:1px solid rgba(186,230,253,.35);
  backdrop-filter:blur(12px);
  padding:8px 12px;
  border-radius:10px;
  font-size:.8rem;
  white-space:nowrap;
  opacity:0;
  pointer-events:none;
  transform:translateY(-6px);
  transition:.25s;
  color:#fff;
  z-index:10;
}

.profile:hover .profile-tooltip{
  opacity:1;
  transform:translateY(0);
}
.profile-letter{
  font-size:18px;
  font-weight:600;
  color:#fff;
  text-transform:uppercase;
  user-select:none;
}
/* ===== LOGO IMAGE ===== */
.logo{
  display:flex;
  align-items:center;
  gap:12px;
}

.logo-img{
  width:60px;
  height:60px;
  object-fit:cover;
  border-radius:50%;
  border:2px solid rgba(186,230,253,0.6);
  box-shadow:0 0 12px rgba(56,189,248,.35);
}
.main header{
  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:18px 24px;
  margin-bottom:20px;
  border-radius:18px;

  background:linear-gradient(
    180deg,
    rgba(2,132,199,0.45),
    rgba(2,132,199,0.28)
  );

  backdrop-filter:blur(18px);
  border:1px solid rgba(186,230,253,0.35);
  box-shadow:0 8px 24px rgba(2,132,199,.35);
}

.main header h1{
  margin:0;
  font-size:1.4rem;
  font-weight:600;
  color:#fff;
}

/* ===== MODAL ===== */
.modal-overlay{
  position:fixed;
  inset:0;
  background:rgba(2,6,23,.75);
  backdrop-filter:blur(10px);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:999;
}
.modal-overlay.hidden{
  display:none;
}

.modal{
  width:90%;
  max-width:700px;
  max-height:90vh;
  overflow-y:auto;

  background:linear-gradient(
    180deg,
    rgba(224,242,254,0.35),
    rgba(186,230,253,0.18)
  );
  border:1px solid rgba(186,230,253,.35);
  border-radius:26px;
  padding:28px;
  box-shadow:0 30px 80px rgba(56,189,248,.45);
  position:relative;
}

.modal-close{
  position:absolute;
  top:16px;
  right:20px;
  font-size:28px;
  cursor:pointer;
  opacity:.7;
}
.modal-close:hover{opacity:1}

/* ===== PROFILE MENU ===== */
.profile-menu{
  position:absolute;
  top:52px;
  right:0;
  min-width:160px;
  background:rgba(2, 18, 85, 0.95);
  border:1px solid rgba(186,230,253,.35);
  backdrop-filter:blur(12px);
  border-radius:14px;
  padding:8px;
  box-shadow:0 10px 30px rgba(0,0,0,.45);
  z-index:20;
}

.profile-menu div{
  padding:10px 12px;
  border-radius:10px;
  cursor:pointer;
  font-size:.9rem;
}

.profile-menu div:hover{
  background:rgba(56,189,248,.15);
}

.hidden{ display:none !important; }
/* ===== MOBILE FIX ===== */
@media (max-width: 768px) {

  body{
    font-size: 16px;
  }

  h1{
    font-size: 1.6rem;
  }

  label{
    font-size: .85rem;
  }

  input, textarea, select{
    font-size: 1rem;
    padding: 16px 18px;
  }

  button{
    font-size: 1rem;
    padding: 16px 22px;
    min-height: 48px;
  }

  .nav a{
    font-size: 1rem;
    min-height: 48px;
  }

  .service-box{
    font-size: 1rem;
    min-height: 48px;
  }
}

/* ===== MOBILE SIDEBAR TOGGLE ===== */
.mobile-menu-btn{
  display:none;
  font-size:26px;
  cursor:pointer;
}

@media (max-width: 768px) {

  .mobile-menu-btn{
    display:block;
  }

  body{
    flex-direction: column;
  }

  .sidebar{
    position: fixed;
    top: 0;
    left: -100%;
    height: 100vh;
    width: 260px;
    z-index: 1000;
    transition: left .3s ease;
  }

  .sidebar.active{
    left: 0;
  }

  .main{
    margin-left: 0;
  }
}
/* ===== SIDEBAR CLOSE BUTTON ===== */
.sidebar-close{
  display: none;
  position: absolute;
  top: 16px;
  right: -45px;
  width: 40px;
  height: 40px;
  background: #020617;
  border-radius: 50%;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 0 10px rgba(0,0,0,.4);
}

.sidebar-close i{
  font-size: 18px;
}

/* Mobile only */
@media (max-width: 768px){
  .sidebar-close{
    display: flex;
  }
}

</style>
</head>

<body>
<div class="bg-layer"></div>
<!-- ===== SIDEBAR ===== -->
<aside class="sidebar" onclick="event.stopPropagation()">

</div>

  <div class="logo">

</div>
</div>

document.addEventListener("DOMContentLoaded", async () => {
  const { data, error } = await supabaseClient.auth.getUser();

async function logout(){
  await supabaseClient.auth.signOut();
  localStorage.removeItem("userFName");
  localStorage.removeItem("userLName");
  location.href = "auth.html";
}

function toggleAddServices(event){
  event.stopPropagation();
  document.getElementById("addServicesMenu").classList.toggle("hidden");
}

async function loadServices(type){

  const { data, error } = await supabaseClient
    .from("services")
    .select("*")
    .eq("email", email)
    .eq("service_type", type);

  if(error){
    console.error(error);
    return;
  }

  if(data.length){
    document.getElementById("noServices").style.display="none";
  }

  data.forEach(r=>{

    const box=document.createElement("div");
    box.className="service-box";

    box.innerHTML=`
      <b>${r.service_name}</b>
      <small>${r.service_type}</small>
    `;

    box.onclick=()=>{
      editingRow=r.id;
      openForm(type,r);
    };

    document.getElementById("postedServices").appendChild(box);

  });
}

  modal.classList.remove("hidden");

  <label>Photo</label>

       src="${data?.photo_url || ''}"
       style="
         width:100%;

       ">

  <input type="file" accept="image/*" onchange="handlePhoto(event)">
</div>

`;

  let extra = "";

  if(type === "transport"){
  extra = `

    </div>

      </select>
    </div>

    <div>
      <label>Price per KM</label>
      <input name="price" value="${data?.price || ''}">
    </div>
  `;
}

  if(type === "hotel"){
  extra = `
    <div>
      <label>City</label>
      <input name="city" value="${data?.city || ''}">
    </div>

    <div>
      <label>Address</label>
      <input name="address" value="${data?.address || ''}">
    </div>

    <div>
      <label>Price</label>
      <input name="price" value="${data?.price || ''}">
    </div>
  `;
}

  if(type === "restaurant"){
  extra = `
    <div>
      <label>City</label>
      <input name="city" value="${data?.city || ''}">
    </div>

    <div>
      <label>Address</label>
      <input name="address" value="${data?.address || ''}">
    </div>

    <div>
      <label>Average Price</label>
      <input name="price" value="${data?.price || ''}">
    </div>

    <div>
      <label>Breakfast</label>
      <select name="breakfast">
        <option ${data?.breakfast==="YES"?"selected":""}>YES</option>
        <option ${data?.breakfast==="NO"?"selected":""}>NO</option>
      </select>
    </div>

    <div>
      <label>Lunch</label>
      <select name="lunch">
        <option ${data?.lunch==="YES"?"selected":""}>YES</option>

}

f.innerHTML = `

      ${data ? `

  <button type="submit">Save Service</button>

  </form>

document
  .getElementById("serviceForm")
  .addEventListener("submit", e => save(e, type));

async function save(e,type){

  e.preventDefault();

  const fd = new FormData(e.target);
  const data = Object.fromEntries(fd.entries());

  let photoUrl = existingPhotoUrl;

  if(selectedPhotoFile){
    photoUrl = await uploadToSupabase(selectedPhotoFile);
  }

  data.email = email;
  data.service_type = type;
  data.photo_url = photoUrl;

  if(editingRow){

    const { error } = await supabaseClient
      .from("services")
      .update(data)
      .eq("id", editingRow);

    if(error){
      console.error(error);
      alert("Update failed");
      return;
    }

  }else{

    const { error } = await supabaseClient
      .from("services")
      .insert(data);

    if(error){
      console.error(error);
      alert("Insert failed");
      return;
    }

  }

  location.reload();
}

async function deleteService(){

  if(!confirm("Delete this service?")) return;

  const { error } = await supabaseClient
    .from("services")
    .delete()
    .eq("id", editingRow);

  if(error){
    alert("Delete failed");
    console.error(error);
    return;
  }

  location.reload();
}

function closeModal(){
  document.getElementById("modalOverlay").classList.add("hidden");
  editingRow = null;
}

        <div>
          <label>Last Name</label>
          <input value="${last_name}" disabled>
        </div>

        <div>
          <label>Email</label>
          <input value="${email}" disabled>
        </div>

        <div>
          <label>Account Type</label>
          <input value="${category}" disabled>
        </div>
      </div>

      <div class="form-actions">
        <button type="button" onclick="closeModal()">Close</button>
      </div>
    </form>
  `;

  modal.classList.remove("hidden");
}
function toggleSidebar(){
  document.querySelector(".sidebar").classList.toggle("active");
}
function closeSidebar(){
  document.querySelector(".sidebar").classList.remove("active");
}

function handlePhoto(e){
  const file = e.target.files[0];
  if (!file) return;

  selectedPhotoFile = file;

  const preview = document.getElementById("photoPreview");
  preview.src = URL.createObjectURL(file);
  preview.style.display = "block";
}

async function uploadToSupabase(file) {
  const ext = file.name.split('.').pop();
  const path = `${email}/${Date.now()}.${ext}`;

  const { error } = await supabaseClient
    .storage
    .from("service-photos")
    .upload(path, file, { upsert: true });

  if (error) {
    alert("Photo upload failed");
    throw error;
  }

  const { data } = supabaseClient
    .storage
    .from("service-photos")
    .getPublicUrl(path);

  return data.publicUrl;
}

</script>
