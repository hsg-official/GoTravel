<body>

    <div class="container">
        <h1 class="page-title">Local Experts</h1>
        <p class="page-subtitle">Add a professional guide to your planned trips.</p>

        <div class="guides-grid" id="guidesContainer">
            <div class="loader" id="loader">
                <i class="fas fa-compass"></i>
                <span>Locating guides...</span>
            </div>
        </div>

    <div class="modal-overlay" id="bookingModal">
        <div class="modal-content">
            <i class="fas fa-times close-modal" onclick="closeModal()"></i>
            <h2 class="modal-title">Attach Guide to Trip</h2>
            <p class="modal-subtitle" id="modalGuideName">Guide: ---</p>

            <form id="bookingForm" onsubmit="confirmBooking(event)">
                <input type="hidden" id="guideEmail">
                <input type="hidden" id="guideNameStr">

                <div class="input-group">
                    <label>Select Your Planned Trip</label>
                    <select id="tripSelect" class="input-field" required>
                        <option value="">Loading trips...</option>
                    </select>
                </div>

                <button type="submit" id="confirmBtn" class="book-btn" style="margin-top: 10px;">ADD TO MY TRIP</button>
            </form>
        </div>
    </div>
