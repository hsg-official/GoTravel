    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script type="text/javascript">

        (function() { emailjs.init("0snPOI_S_7ftRX9BK"); })();

        // [2] SUPABASE INIT
        const supabaseUrl = 'https://cdcolkoavowjjymzdzud.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNkY29sa29hdm93amp5bXpkenVkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njg0MDI2NjQsImV4cCI6MjA4Mzk3ODY2NH0.JPzj9fI1pKpPbPxyGqsemjcwpKiu0h046H7aBSURnpM';

    <link rel="stylesheet" href="../css/guides_style.css">
</head>

<body>

    <div class="bg-layer"></div>
    <div id="toast-container"></div>

    <header>
        <a href="index.html" class="logo">GoTravel</a>
        <a href="personal.html" class="back-btn"><i class="fas fa-chevron-left"></i> Dashboard</a>
    </header>

    <div class="container">
        <h1 class="page-title">Local Experts</h1>
        <p class="page-subtitle">Add a professional guide to your planned trips.</p>

        <div class="guides-grid" id="guidesContainer">
            <div class="loader" id="loader">
                <i class="fas fa-compass"></i>
                <span>Locating guides...</span>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="bookingModal">
        <div class="modal-content">
            <i class="fas fa-times close-modal" onclick="closeModal()"></i>
            <h2 class="modal-title">Attach Guide to Trip</h2>
            <p class="modal-subtitle" id="modalGuideName">Guide: ---</p>

            <form id="bookingForm" onsubmit="confirmBooking(event)">
                <input type="hidden" id="guideEmail">
                <input type="hidden" id="guideNameStr">

                <div class="input-group">
                    <label>Select Your Planned Trip</label>
                    <select id="tripSelect" class="input-field" required>
                        <option value="">Loading trips...</option>
                    </select>
                </div>

                <button type="submit" id="confirmBtn" class="book-btn" style="margin-top: 10px;">ADD TO MY TRIP</button>
            </form>
        </div>
    </div>

    <div class="modal-overlay" id="guideDetailsModal">
        <div class="modal-content" style="max-width: 500px;">
            <i class="fas fa-times close-modal" onclick="closeGuideDetails()"></i>
            <h2 class="modal-title" id="detGuideName">Guide Name</h2>
            <p class="modal-subtitle" id="detGuideLocation" style="margin-bottom: 20px;"><i class="fas fa-map-marker-alt"></i> Location</p>

            <div style="margin-bottom: 15px; background: rgba(0,0,0,0.5); padding: 15px; border-radius: 12px; border: 1px solid var(--glass-border);">
                <h4 style="color: var(--accent); margin-bottom: 5px; font-size: 0.9rem;"><i class="fas fa-star"></i> Specializations</h4>
                <p id="detGuideSpec" style="font-size: 0.85rem; color: var(--text-muted); line-height: 1.4;">...</p>
            </div>

            <div style="margin-bottom: 15px; background: rgba(0,0,0,0.5); padding: 15px; border-radius: 12px; border: 1px solid var(--glass-border);">
                <h4 style="color: var(--accent); margin-bottom: 5px; font-size: 0.9rem;"><i class="fas fa-concierge-bell"></i> Facilities Provided</h4>
                <p id="detGuideFac" style="font-size: 0.85rem; color: var(--text-muted); line-height: 1.4;">...</p>
            </div>

            <div style="margin-bottom: 25px; background: rgba(0,0,0,0.5); padding: 15px; border-radius: 12px; border: 1px solid var(--glass-border);">
                <h4 style="color: var(--accent); margin-bottom: 5px; font-size: 0.9rem;"><i class="fas fa-credit-card"></i> Payment Methods</h4>
                <p id="detGuidePay" style="font-size: 0.85rem; color: var(--text-muted); line-height: 1.4;">...</p>
            </div>

            <button class="book-btn" id="modalSelectBtn">BOOK THIS GUIDE</button>
        </div>
    </div>

    <script src="../backend/guides_script.js"></script>
</body>
</html>
