<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >
  <title>GoTravel | Admin Access</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Syncopate:wght@700&display=swap"
    rel="stylesheet"
  >
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
  >
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Reuse the normal authentication page design. -->
  <link rel="stylesheet" href="../css/auth_style.css">

  <style>
    .admin-card { overflow: hidden; }

    .admin-symbol {
      width: 64px;
      height: 64px;
      margin: 0 auto 18px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(14, 165, 233, 0.45);
      border-radius: 20px;
      color: #fff;
      font-size: 1.65rem;
      background: linear-gradient(
        145deg,
        rgba(79, 70, 229, 0.35),
        rgba(14, 165, 233, 0.16)
      );
      box-shadow: 0 12px 35px rgba(14, 165, 233, 0.2);
    }

    .admin-label {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin-top: 12px;
      padding: 6px 11px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 999px;
      color: #cbd5e1;
      background: rgba(255, 255, 255, 0.05);
      font-size: 0.72rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .admin-form { margin-top: 24px; }

    .security-note {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin: 18px 0 2px;
      padding: 12px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      color: var(--text-muted);
      background: rgba(0, 0, 0, 0.2);
      font-size: 0.75rem;
      line-height: 1.45;
    }

    .security-note i {
      margin-top: 2px;
      color: var(--accent);
    }

    .admin-help-link {
      display: block;
      margin-top: 18px;
      color: var(--text-muted);
      font-size: 0.8rem;
      text-align: center;
      text-decoration: none;
      transition: 0.25s ease;
    }

    .admin-help-link:hover { color: #fff; }

    .action-btn:disabled {
      cursor: wait;
      opacity: 0.72;
      transform: none;
      box-shadow: none;
    }

    #loginMessage {
      min-height: 20px;
      margin-top: 12px;
      color: var(--text-muted);
      font-size: 0.78rem;
      text-align: center;
    }

    #loginMessage.error { color: var(--error); }

    @media (max-width: 480px) {
      .admin-card { padding: 2rem 1.5rem; }
    }
  </style>
</head>

<body>
  <div class="bg-layer"></div>
  <div id="toast-container"></div>

  <a href="../index.html" class="back-home">
    <i class="fas fa-chevron-left"></i>
    Home
  </a>

  <main class="auth-card admin-card">
    <div class="header-text">
      <div class="admin-symbol" aria-hidden="true">
        <i class="fas fa-shield-halved"></i>
      </div>

      <h1 class="logo">GoTravel</h1>
      <p class="subtitle">Secure administrator access</p>

      <span class="admin-label">
        <i class="fas fa-lock"></i>
        Restricted portal
      </span>
    </div>

    <form id="adminLoginForm" class="admin-form">
      <div class="input-group">
        <input
          id="adminEmail"
          class="input-field"
          type="email"
          placeholder="Admin email address"
          autocomplete="username"
          required
        >
        <i class="fas fa-envelope input-icon" aria-hidden="true"></i>
      </div>

      <div class="input-group">
        <input
          id="adminPassword"
          class="input-field"
          type="password"
          placeholder="Password"
          autocomplete="current-password"
          required
        >
        <i
          class="fas fa-eye input-icon"
          id="passwordToggle"
          role="button"
          tabindex="0"
          aria-label="Show password"
        ></i>
      </div>

      <button
        id="adminLoginButton"
        class="action-btn"
        type="submit"
      >
        ACCESS ADMIN PANEL
      </button>

      <p id="loginMessage" aria-live="polite"></p>
    </form>

    <div class="security-note">
      <i class="fas fa-circle-info"></i>
      <span>
        This portal is limited to authorized GoTravel administrators.
        Access is verified using your assigned administrator role.
      </span>
    </div>

    <a href="auth.html" class="admin-help-link">
      Looking for traveller or business login?
    </a>
  </main>

  <script>
    const supabaseUrl =
      "https://cdcolkoavowjjymzdzud.supabase.co";
    const supabaseKey =
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNkY29sa29hdm93amp5bXpkenVkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njg0MDI2NjQsImV4cCI6MjA4Mzk3ODY2NH0.JPzj9fI1pKpPbPxyGqsemjcwpKiu0h046H7aBSURnpM";

    const supabaseClient = window.supabase.createClient(
      supabaseUrl,
      supabaseKey
    );

    const form = document.getElementById("adminLoginForm");
    const emailInput = document.getElementById("adminEmail");
    const passwordInput = document.getElementById("adminPassword");
    const loginButton = document.getElementById("adminLoginButton");
    const loginMessage = document.getElementById("loginMessage");
    const passwordToggle = document.getElementById("passwordToggle");

    function showToast(message, type = "success") {
      const container = document.getElementById("toast-container");
      const toast = document.createElement("div");

      toast.className = `toast ${type}`;
      toast.innerHTML = `
        <i class="fas ${
          type === "success"
            ? "fa-check-circle"
            : "fa-exclamation-circle"
        }"></i>
        <span>${message}</span>
      `;

      container.appendChild(toast);

      setTimeout(() => {
        toast.style.opacity = "0";
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }

    function togglePassword() {
      const isHidden = passwordInput.type === "password";

      passwordInput.type = isHidden ? "text" : "password";
      passwordToggle.classList.toggle("fa-eye", !isHidden);
      passwordToggle.classList.toggle("fa-eye-slash", isHidden);
      passwordToggle.setAttribute(
        "aria-label",
        isHidden ? "Hide password" : "Show password"
      );
    }

    passwordToggle.addEventListener("click", togglePassword);
    passwordToggle.addEventListener("keydown", (event) => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        togglePassword();
      }
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      loginButton.disabled = true;
      loginButton.textContent = "VERIFYING...";
      loginMessage.className = "";
      loginMessage.textContent = "Checking administrator credentials...";

      const { data, error } =
        await supabaseClient.auth.signInWithPassword({
          email: emailInput.value.trim().toLowerCase(),
          password: passwordInput.value
        });

      if (error) {
        loginButton.disabled = false;
        loginButton.textContent = "ACCESS ADMIN PANEL";
        loginMessage.className = "error";
        loginMessage.textContent = "Invalid email or password.";
        showToast("Unable to sign in with those credentials.", "error");
        return;
      }

      const role = data.user?.app_metadata?.role;

      if (role !== "admin") {
        await supabaseClient.auth.signOut();

        loginButton.disabled = false;
        loginButton.textContent = "ACCESS ADMIN PANEL";
        loginMessage.className = "error";
        loginMessage.textContent =
          "This account does not have administrator access.";
        showToast("Administrator access required.", "error");
        return;
      }

      loginMessage.className = "";
      loginMessage.textContent = "Access granted. Opening dashboard...";
      showToast("Administrator verified.", "success");

      setTimeout(() => {
        window.location.href = "admin.html";
      }, 700);
    });
  </script>
</body>
</html>
