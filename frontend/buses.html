<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoTravel | Bus Tickets</title>
    <link rel="stylesheet" href="../css/buses_style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="background-overlay"></div>

    <!-- NAV -->
    <header>
        <nav class="glass-nav">
            <div class="logo-container">
                <div class="logo-circle">
                    <img src="../src/images/GoTravels.png" alt="GoTravel Logo" class="logo-img">
                </div>
                <span class="logo-text">Go<span>Travel</span></span>
            </div>
            <ul class="nav-links">
                <li><a href="places.html">Destinations</a></li>
                <li class="dropdown">
                    <a href="javascript:void(0)" id="transportBtn">Transport</a>
                    <div class="dropdown-content" id="transportMenu">
                        <a href="buses.html" class="dropdown-item active-link">
                            <ion-icon name="bus-outline"></ion-icon>
                            <span>Buses</span>
                        </a>
                        <a href="cabs.html" class="dropdown-item">
                            <ion-icon name="car-outline"></ion-icon>
                            <span>Cabs</span>
                        </a>
                    </div>
                </li>
                <li><a href="../index.html">Home</a></li>
            </ul>
        </nav>
    </header>

    <!-- HERO + SEARCH -->
    <section class="hero">
        <div class="hero-content">
            <div class="hero-badge"><i class="fas fa-bus"></i> Bus Tickets</div>
            <h1>Travel Across <span class="accent">Sri Lanka</span></h1>
            <p class="subtitle">Search, compare and book bus routes instantly</p>
        </div>

        <div class="search-card">
            <!-- Trip Type -->
            <div class="trip-type-row">
                <button class="trip-btn active" id="oneWayBtn" onclick="setTripType('one-way')">One Way</button>
                <button class="trip-btn" id="roundBtn" onclick="setTripType('round')">Round Trip</button>
            </div>

            <!-- Search Fields -->
            <div class="search-fields">
                <div class="field-group">
                    <label><i class="fas fa-circle-dot"></i> From</label>
                    <select id="fromCity" class="field-input">
                        <option value="">Select City</option>
                    </select>
                </div>

                <button class="swap-btn" onclick="swapCities()" title="Swap cities">
                    <i class="fas fa-arrows-left-right"></i>
                </button>

                <div class="field-group">
                    <label><i class="fas fa-location-dot"></i> To</label>
                    <select id="toCity" class="field-input">
                        <option value="">Select City</option>
                    </select>
                </div>

                <div class="field-group">
                    <label><i class="fas fa-calendar-days"></i> Date</label>
                    <input type="date" id="travelDate" class="field-input">
                </div>

                <div class="field-group" id="returnDateGroup" style="display:none;">
                    <label><i class="fas fa-calendar-check"></i> Return</label>
                    <input type="date" id="returnDate" class="field-input">
                </div>

                <div class="field-group">
                    <label><i class="fas fa-users"></i> Passengers</label>
                    <div class="passenger-control">
                        <button onclick="changePassengers(-1)">−</button>
                        <span id="passengerCount">1</span>
                        <button onclick="changePassengers(1)">+</button>
                    </div>
                </div>
            </div>

            <button class="search-btn" onclick="searchBuses()">
                <i class="fas fa-magnifying-glass"></i> Search Buses
            </button>
        </div>
    </section>

    <!-- RESULTS SECTION -->
    <section class="results-section" id="resultsSection" style="display:none;">
        <div class="results-header">
            <h2 id="resultsTitle">Available Buses</h2>
            <div class="sort-row">
                <span>Sort by:</span>
                <button class="sort-btn active" onclick="sortResults('price')">Price</button>
                <button class="sort-btn" onclick="sortResults('duration')">Duration</button>
                <button class="sort-btn" onclick="sortResults('departure')">Departure</button>
            </div>
        </div>

        <div class="results-grid" id="busResults">
            <!-- Cards injected by JS -->
        </div>
    </section>

    <!-- BOOKING MODAL -->
    <div class="modal-overlay" id="bookingModal" style="display:none;">
        <div class="modal-card">
            <button class="modal-close" onclick="closeModal()"><i class="fas fa-xmark"></i></button>
            <h2 class="modal-title">Confirm Booking</h2>

            <div class="booking-summary" id="bookingSummary"></div>

            <div class="booking-form">
                <div class="form-row">
                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" id="passengerName" placeholder="Your full name" class="form-input">
                    </div>
                    <div class="form-group">
                        <label>Phone Number</label>
                        <input type="tel" id="passengerPhone" placeholder="+94 XX XXX XXXX" class="form-input">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" id="passengerEmail" placeholder="your@email.com" class="form-input">
                    </div>
                    <div class="form-group">
                        <label>NIC / Passport</label>
                        <input type="text" id="passengerNIC" placeholder="ID number" class="form-input">
                    </div>
                </div>

                <div class="seat-section">
                    <label>Select Seats</label>
                    <div class="seat-map" id="seatMap"></div>
                    <p class="seat-legend">
                        <span class="legend-dot available"></span> Available
                        <span class="legend-dot selected"></span> Selected
                        <span class="legend-dot taken"></span> Taken
                    </p>
                </div>

                <div class="total-row">
                    <span>Total Amount</span>
                    <span class="total-price" id="totalPrice">LKR 0</span>
                </div>

                <button class="confirm-btn" onclick="confirmBooking()">
                    <i class="fas fa-check-circle"></i> Confirm & Book
                </button>
            </div>
        </div>
    </div>

    <!-- SUCCESS TOAST -->
    <div class="toast" id="successToast">
        <i class="fas fa-circle-check"></i>
        <div>
            <strong>Booking Confirmed!</strong>
            <p id="toastMsg">Your ticket has been booked.</p>
        </div>
    </div>

    <script src="../backend/buses_script.js"></script>
</body>
</html>
