<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GoTravel | Business Dashboard</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
:root{
  --accent:#3b82f6;
  --glass:rgba(255,255,255,0.08);
  --border:rgba(255,255,255,0.18);
  --bg:#000;
}
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  font-family:'Inter',system-ui;
  color:#fff;
  background:
    radial-gradient(circle at 20% 20%, rgba(59,130,246,0.15), transparent 40%),
    radial-gradient(circle at 80% 80%, rgba(14,165,233,0.15), transparent 40%),
    #000;
}

/* ===== HEADER ===== */
header{
  padding:22px 5%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  backdrop-filter:blur(25px);
  background:rgba(0,0,0,0.6);
  border-bottom:1px solid var(--border);
}
h1{
  font-size:1.8rem;
  font-weight:700;
  letter-spacing:1px;
}

/* ===== LAYOUT ===== */
.container{
  max-width:1200px;
  margin:auto;
  padding:30px 5%;
}

/* ===== GLASS CARD ===== */
.card{
  background:var(--glass);
  backdrop-filter:blur(30px) saturate(160%);
  border:1px solid var(--border);
  border-radius:24px;
  padding:24px;
  margin-bottom:25px;
  box-shadow:0 20px 60px rgba(0,0,0,0.6);
  animation:fadeUp .6s ease;
}

@keyframes fadeUp{
  from{opacity:0; transform:translateY(15px)}
  to{opacity:1; transform:none}
}

/* ===== SERVICES GRID ===== */
.flex{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
  gap:20px;
}

/* ===== SERVICE CARD ===== */
.service-box{
  background:rgba(0,0,0,0.4);
  border:1px solid var(--border);
  border-radius:18px;
  padding:20px;
  cursor:pointer;
  transition:.4s cubic-bezier(.2,.8,.2,1);
  position:relative;
  overflow:hidden;
}
.service-box::before{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(120deg,transparent,rgba(59,130,246,.25),transparent);
  opacity:0;
  transition:.4s;
}
.service-box:hover::before{opacity:1}
.service-box:hover{
  transform:translateY(-8px) scale(1.02);
  border-color:var(--accent);
  box-shadow:0 25px 60px rgba(59,130,246,0.35);
}
.service-box b{
  font-size:1.05rem;
  display:block;
  margin-bottom:4px;
}
.service-box small{
  opacity:.7;
  text-transform:uppercase;
  letter-spacing:1px;
  font-size:.65rem;
}

/* ===== BUTTONS ===== */
button{
  background:linear-gradient(135deg,var(--accent),#0ea5e9);
  border:none;
  color:#fff;
  padding:14px 20px;
  border-radius:14px;
  cursor:pointer;
  font-weight:700;
  letter-spacing:.5px;
  transition:.3s;
}
button:hover{
  transform:translateY(-2px);
  box-shadow:0 10px 30px rgba(59,130,246,.5);
}

/* ===== PLUS ===== */
.plus{
  font-size:28px;
  color:var(--accent);
  cursor:pointer;
  margin-left:10px;
  transition:.3s;
}
.plus:hover{
  transform:rotate(90deg) scale(1.2);
}

/* ===== MENU ===== */
.menu button{
  width:100%;
  margin-bottom:10px;
  background:rgba(0,0,0,0.5);
  border:1px solid var(--border);
}

/* ===== FORMS ===== */
input,textarea,select{
  width:100%;
  padding:14px 16px;
  background:rgba(0,0,0,0.45);
  border:1px solid var(--border);
  border-radius:14px;
  color:#fff;
  margin-bottom:14px;
  outline:none;
  transition:.3s;
}
input:focus,textarea:focus,select:focus{
  border-color:var(--accent);
  box-shadow:0 0 0 2px rgba(59,130,246,.25);
}

img.preview{
  width:100%;
  border-radius:14px;
  margin-top:10px;
}

.hidden{display:none}

/* ===== MOBILE ===== */
@media(max-width:600px){
  h1{font-size:1.4rem}
}
</style>

</head>

<body>

<header>
  <h1>Business Dashboard <span style="opacity:.5;font-size:.8rem">GoTravel</span></h1>
  <button onclick="logout()">Logout</button>
</header>

<div class="container">

<!-- MY SERVICES -->
<div class="card">
  <h2>My Services <span class="plus" onclick="toggleMenu()">＋</span></h2>
  <div id="serviceList" class="flex"></div>
</div>

<!-- SERVICE MENU -->
<div id="menu" class="card hidden menu">
  <button onclick="openForm('transport')">🚗 Transport</button>
  <button onclick="openForm('hotel')">🏨 Hotel</button>
  <button onclick="openForm('restaurant')">🍽 Restaurant</button>
  <button onclick="openForm('guide')">🧭 Guide</button>
</div>

<!-- FORM -->
<div id="formCard" class="card hidden"></div>

</div>

<script>
/* ================= CONFIG ================= */
const API = "https://script.google.com/macros/s/AKfycbyBajUZwuiWX14g3MhDqF0jg9j-8O2A3T6MpLuVaVJbkqaB6PY2yqh1_EANKzP23_E/exec";
const email = localStorage.getItem("user_email");
if(!email) location.href="auth.html";
/*const email = localStorage.getItem("user_email") || "testbusiness@gotravel.com";
*/
/* ================= UI ================= */
function toggleMenu(){
  document.getElementById("menu").classList.toggle("hidden");
}
function logout(){
  localStorage.clear();
  location.href="index.html";
}

/* ================= LOAD SERVICES ================= */
["transport","hotel","restaurant","guide"].forEach(loadServices);

function loadServices(type){
  fetch(`${API}?type=${type}&email=${email}`)
  .then(r=>r.json())
  .then(rows=>{
    rows.forEach(r=>{
      const box=document.createElement("div");
      box.className="service-box";
      box.innerHTML=`<b>${r[0]}</b><br><small>${type}</small>`;
      box.onclick=()=>openForm(type,r);
      serviceList.appendChild(box);
    });
  });
}

/* ================= FORMS ================= */
function openForm(type,data=null){
  toggleMenu();
  const f=document.getElementById("formCard");
  f.classList.remove("hidden");

  const common=`
    <input name="name" placeholder="Service Name" value="${data?.[0]||''}" required>
    <input name="contact" placeholder="Contact No" value="${data?.[1]||''}">
    <textarea name="desc" placeholder="Description">${data?.slice(-2,-1)||''}</textarea>
    <input type="file" name="photo">
  `;

  let extra="";
  if(type==="transport"){
    extra=`
      <input name="address" placeholder="Address">
      <select name="public">
        <option>Public</option><option>Private</option>
      </select>
      <input name="price" placeholder="Price per KM">
    `;
  }
  if(type==="hotel"){
    extra=`
      <input name="city" placeholder="City">
      <input name="address" placeholder="Address">
      <input name="price" placeholder="Room & Meals Price">
    `;
  }
  if(type==="restaurant"){
    extra=`
      <input name="city" placeholder="City">
      <input name="address" placeholder="Address">
      <input name="price" placeholder="Average Price">
      <select name="breakfast"><option>YES</option><option>NO</option></select>
      <select name="lunch"><option>YES</option><option>NO</option></select>
      <select name="dinner"><option>YES</option><option>NO</option></select>
    `;
  }
  if(type==="guide"){
    extra=`
      <input name="location" placeholder="Service Location">
      <input name="lang" placeholder="Languages">
    `;
  }

  f.innerHTML=`
    <h3>${data?"Edit":"Add"} ${type}</h3>
    <form onsubmit="save(event,'${type}',${data?JSON.stringify(data):null})">
      ${common}
      ${extra}
      <button>Save</button>
    </form>
  `;
}

/* ================= SAVE ================= */
function save(e,type,old){
  e.preventDefault();
  const fd=new FormData(e.target);
  fd.append("type",type);
  fd.append("email",email);
  if(old) fd.append("old",JSON.stringify(old));

  fetch(API,{method:"POST",body:fd})
  .then(()=>location.reload());
}
</script>

</body>
</html>
