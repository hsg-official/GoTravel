<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GoTravel | Business Dashboard</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --accent:#38bdf8;
  --glass:rgba(186,230,253,0.18);
  --border:rgba(186,230,253,0.28);
  --bg:#020617;
}

*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  font-family:'Inter',system-ui;
  color:#fff;
  display:flex;
  background:
    radial-gradient(circle at 20% 20%, rgba(56,189,248,0.35), transparent 45%),
    radial-gradient(circle at 80% 80%, rgba(125,211,252,0.35), transparent 45%),
    linear-gradient(180deg,#010a35,#020617);
  overflow-x: hidden;

}

/* ===== SIDEBAR ===== */
.sidebar{
  width:260px;
  height:150vh;
  background:linear-gradient(
    180deg,
    rgba(1, 32, 47, 0.45),   /* darker sky blue */
    rgba(2,132,199,0.28)
  );
  backdrop-filter:blur(20px);
  border-right:1px solid rgba(186,230,253,0.35);
}


.logo{
  display:flex;
  align-items:center;
  gap:12px;
  font-size:1.2rem;
  font-weight:700;
  color:var(--accent);
  margin-bottom:35px;
}

.nav{
  display:flex;
  flex-direction:column;
  gap:6px;
}

.nav a{
  text-decoration:none;
  color:#cbd5e1;
  padding:12px 14px;
  border-radius:14px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  transition:.3s;
  font-size:.95rem;
  cursor:pointer;
}

.nav a:hover{
  background:rgba(56,189,248,.15);
  color:#fff;
}

.nav a.active{
  background:linear-gradient(135deg,rgba(56,189,248,.35),rgba(56,189,248,.15));
  color:#fff;
}

.section-title{
  margin:20px 0 8px;
  font-size:.7rem;
  letter-spacing:1px;
  text-transform:uppercase;
  opacity:.6;
}

.submenu{
  margin-left:12px;
  margin-top:6px;
  display:flex;        /* ✅ allow flex */
  flex-direction:column;
  gap:4px;
}

.submenu a{
  padding:10px 14px;
  font-size:.9rem;
  background:rgba(56,189,248,.08);
  border-radius:12px;
}

/* ===== MAIN ===== */
.main{flex:1}

/* ===== HEADER ===== */
header{
  padding:22px 5%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  backdrop-filter:blur(25px);
  background:rgba(0,0,0,0.45);
  border-bottom:1px solid var(--border);
}

h1{font-size:1.7rem}

/* ===== CONTENT ===== */
.container{
  max-width:1200px;
  margin:auto;
  padding:30px 5%;
}

/* ===== TABS ===== */
.tabs{
  display:flex;
  gap:30px;
  margin-bottom:25px;
  border-bottom:1px solid rgba(255,255,255,.15);
}

.tab-active{
  padding-bottom:10px;
  border-bottom:2px solid var(--accent);
  color:var(--accent);
  font-weight:600;
}

/* ===== CARD ===== */
.card{
  background:linear-gradient(
    180deg,
    rgba(224,242,254,0.28),
    rgba(186,230,253,0.14)
  );
  backdrop-filter:blur(34px) saturate(190%);
  border:1px solid var(--border);
  border-radius:24px;
  padding:24px;
  margin-bottom:25px;
  box-shadow:0 25px 60px rgba(14,165,233,0.35);
}

/* ===== GRID ===== */
.flex{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
  gap:20px;
}

/* ===== SERVICE CARD ===== */
.service-box{
  background:rgba(186,230,253,0.16);
  border:1px solid rgba(186,230,253,0.35);
  border-radius:18px;
  padding:20px;
  cursor:pointer;
  transition:.3s;
}
.service-box:hover{
  transform:translateY(-6px);
  box-shadow:0 20px 40px rgba(56,189,248,.35);
}
.service-box b{display:block}

/* ===== BUTTON ===== */
button{
  background:linear-gradient(135deg,var(--accent),#0ea5e9);
  border:none;
  color:#fff;
  padding:14px 20px;
  border-radius:14px;
  cursor:pointer;
  font-weight:700;
}
/* ===== FORM STYLING (CLEAN) ===== */
form{
  margin-top:20px;
}

.form-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
  gap:16px;
}

label{
  font-size:.75rem;
  opacity:.7;
  margin-bottom:6px;
  display:block;
}

input, textarea, select{
  width:100%;
  padding:14px 16px;
  background:rgba(186,230,253,0.18);
  border:1px solid rgba(186,230,253,0.35);
  border-radius:14px;
  color:#fff;
  outline:none;
  transition:.3s;
  font-size:.9rem;
}

textarea{
  resize:none;
  min-height:90px;
}

input:focus,
textarea:focus,
select:focus{
  border-color:var(--accent);
  box-shadow:0 0 0 2px rgba(56,189,248,.35);
}

.form-actions{
  display:flex;
  justify-content:flex-end;
  margin-top:20px;
}
/* ===== PROFILE ICON ===== */
.profile{
  position:relative;
  width:42px;
  height:42px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  background:linear-gradient(
    135deg,
    rgba(56,189,248,.35),
    rgba(56,189,248,.15)
  );
  border:1px solid rgba(56,189,248,.45);
}

.profile i{
  font-size:18px;
  color:#fff;
}

/* Tooltip */
.profile-tooltip{
  position:absolute;
  top:52px;
  right:0;
  background:rgba(2, 18, 85, 0.95);
  border:1px solid rgba(186,230,253,.35);
  backdrop-filter:blur(12px);
  padding:8px 12px;
  border-radius:10px;
  font-size:.8rem;
  white-space:nowrap;
  opacity:0;
  pointer-events:none;
  transform:translateY(-6px);
  transition:.25s;
  color:#fff;
  z-index:10;
}

.profile:hover .profile-tooltip{
  opacity:1;
  transform:translateY(0);
}
.profile-letter{
  font-size:18px;
  font-weight:600;
  color:#fff;
  text-transform:uppercase;
  user-select:none;
}
/* ===== LOGO IMAGE ===== */
.logo{
  display:flex;
  align-items:center;
  gap:12px;
}

.logo-img{
  width:60px;
  height:60px;
  object-fit:cover;
  border-radius:50%;
  border:2px solid rgba(186,230,253,0.6);
  box-shadow:0 0 12px rgba(56,189,248,.35);
}
.main header{
  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:18px 24px;
  margin-bottom:20px;
  border-radius:18px;

  background:linear-gradient(
    180deg,
    rgba(2,132,199,0.45),
    rgba(2,132,199,0.28)
  );

  backdrop-filter:blur(18px);
  border:1px solid rgba(186,230,253,0.35);
  box-shadow:0 8px 24px rgba(2,132,199,.35);
}

.main header h1{
  margin:0;
  font-size:1.4rem;
  font-weight:600;
  color:#fff;
}

/* ===== MODAL ===== */
.modal-overlay{
  position:fixed;
  inset:0;
  background:rgba(2,6,23,.75);
  backdrop-filter:blur(10px);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:999;
}
.modal-overlay.hidden{
  display:none;
}

.modal{
  width:90%;
  max-width:700px;
  max-height:90vh;
  overflow-y:auto;

  background:linear-gradient(
    180deg,
    rgba(224,242,254,0.35),
    rgba(186,230,253,0.18)
  );
  border:1px solid rgba(186,230,253,.35);
  border-radius:26px;
  padding:28px;
  box-shadow:0 30px 80px rgba(56,189,248,.45);
  position:relative;
}

.modal-close{
  position:absolute;
  top:16px;
  right:20px;
  font-size:28px;
  cursor:pointer;
  opacity:.7;
}
.modal-close:hover{opacity:1}

/* ===== PROFILE MENU ===== */
.profile-menu{
  position:absolute;
  top:52px;
  right:0;
  min-width:160px;
  background:rgba(2, 18, 85, 0.95);
  border:1px solid rgba(186,230,253,.35);
  backdrop-filter:blur(12px);
  border-radius:14px;
  padding:8px;
  box-shadow:0 10px 30px rgba(0,0,0,.45);
  z-index:20;
}

.profile-menu div{
  padding:10px 12px;
  border-radius:10px;
  cursor:pointer;
  font-size:.9rem;
}

.profile-menu div:hover{
  background:rgba(56,189,248,.15);
}

.hidden{ display:none !important; }
/* ===== MOBILE FIX ===== */
@media (max-width: 768px) {

  body{
    font-size: 16px;
  }

  h1{
    font-size: 1.6rem;
  }

  label{
    font-size: .85rem;
  }

  input, textarea, select{
    font-size: 1rem;
    padding: 16px 18px;
  }

  button{
    font-size: 1rem;
    padding: 16px 22px;
    min-height: 48px;
  }

  .nav a{
    font-size: 1rem;
    min-height: 48px;
  }

  .service-box{
    font-size: 1rem;
    min-height: 48px;
  }
}


</style>
</head>

<body>

<!-- ===== SIDEBAR ===== -->
<aside class="sidebar">
  <div class="logo">
    <img src="GoTravels.png" class="logo-img" alt="Go Travels">
    <span> GoTravel</span>
  </div>

  <nav class="nav">
    <a onclick=logout()>
      <span><i class="fa-solid fa-house"></i> Home</span>
    </a>
    <a class="active"><span><i class="fa-solid fa-briefcase"></i> My Services</span></a>

    <div class="section-title">Services</div>

    <!-- ADD SERVICES -->
    <a onclick="toggleAddServices()">
      <span><i class="fa-solid fa-plus"></i> Add Services</span>
      <i class="fa-solid fa-chevron-down"></i>
    </a>

    <div id="addServicesMenu" class="submenu hidden">
      <a onclick="openForm('transport')">🚗 Transport</a>
      <a onclick="openForm('hotel')">🏨 Hotel</a>
      <a onclick="openForm('restaurant')">🍽 Restaurant</a>
      <a onclick="openForm('guide')">🧭 Guide</a>
    </div>
  </nav>
</aside>

<!-- ===== MAIN ===== -->
<div class="main">

<header>
  <h1>My Services</h1>
  <div class="profile" id="profileBtn">
  <span class="profile-letter" id="profileLetter"></span>

  <!-- PROFILE MENU -->
  <div class="profile-menu hidden" id="profileMenu">
    <div onclick="openProfileModal()">👤 Profile</div>
    <div onclick="logout()" style="color:#f87171">🚪 Logout</div>
  </div>
</div>

</header>

<div class="container">

  <div class="tabs">
    <div class="tab-active">Posted Services</div>
  </div>

  <div class="card">
    <div id="postedServices" class="flex"></div>
    <p id="noServices" style="opacity:.6;margin-top:15px">
      No services posted yet.
    </p>
  </div>
<!--
  <div id="formCard" class="card hidden"></div>
-->
</div>
</div>
<!-- ===== MODAL ===== -->
<div id="modalOverlay" class="modal-overlay hidden">
  <div class="modal">
    <span class="modal-close" onclick="closeModal()">&times;</span>
    <div id="modalContent"></div>
  </div>
</div>

<script>
const supabaseUrl = 'https://cdcolkoavowjjymzdzud.supabase.co';
const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNkY29sa29hdm93amp5bXpkenVkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njg0MDI2NjQsImV4cCI6MjA4Mzk3ODY2NH0.JPzj9fI1pKpPbPxyGqsemjcwpKiu0h046H7aBSURnpM';
const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

const API="https://script.google.com/macros/s/AKfycbx6nApwvPnka-mWBXyr3q8mmtv-6sTB0XGyTo45YtKfBFYzcfc7URIXNYCwdhkCzPI/exec";
/*const email = localStorage.getItem("user_email");*/

/*const email = localStorage.getItem("user_email") || "testbusiness@gotravel.com";*/
let editingRow = null;
let email = null;

document.addEventListener("DOMContentLoaded", async () => {
  const { data, error } = await supabaseClient.auth.getUser();

  if (error || !data.user) {
    location.href = "auth.html";
    return;
  }

  email = data.user.email;
  //const first_name = localStorage.getItem("userFName") || "";
  //const last_name = localStorage.getItem("userLName") || "";

  document.getElementById("profileLetter").textContent =
    email.charAt(0).toUpperCase();

  //document.getElementById("profileEmail").textContent = email;

  // load services AFTER email exists
  ["transport","hotel","restaurant","guide"].forEach(loadServices);

  document.getElementById("modalOverlay").addEventListener("click", e=>{
  if(e.target.id === "modalOverlay") closeModal();
});
  document.getElementById("profileBtn").addEventListener("click", e => {
  e.stopPropagation();
  document.getElementById("profileMenu").classList.toggle("hidden");
});

document.addEventListener("click", () => {
  document.getElementById("profileMenu").classList.add("hidden");
});

});

/*document.addEventListener("DOMContentLoaded", () => {
  if(!email) return;

  const letterEl = document.getElementById("profileLetter");
  const emailEl  = document.getElementById("profileEmail");

  if(letterEl){
    letterEl.textContent = email.charAt(0).toUpperCase();
  }

  if(emailEl){
    emailEl.textContent = email;
  }
});
*/
//function logout(){
//  localStorage.clear();
//  location.href="index.html";
//}
async function logout(){
  await supabaseClient.auth.signOut();
  localStorage.removeItem("userFName");
  localStorage.removeItem("userLName");
  location.href = "auth.html";
}

function toggleAddServices(){
  document.getElementById("addServicesMenu").classList.toggle("hidden");
}

//["transport","hotel","restaurant","guide"].forEach(loadServices);

function loadServices(type){
  fetch(`${API}?type=${type}&email=${email}`)
    .then(r=>r.json())
    .then(rows=>{
      if(rows.length){
        document.getElementById("noServices").style.display="none";
      }
      rows.forEach(r=>{
        const box=document.createElement("div");
        box.className="service-box";
        box.innerHTML=`<b>${r[1]}</b><small>${type}</small>`;
        box.onclick = () => {
          editingRow = r[r.length - 1]; // ⬅ last value = row number
          openForm(type, r);
        };
        document.getElementById("postedServices").appendChild(box);
      });
    });
}
function openForm(type, data = null){
  editingRow = null;
  if (data) {
    editingRow = data[data.length - 1];
  }
  // Close Add Services dropdown (optional UX)
  const menu = document.getElementById("addServicesMenu");
  if(menu) menu.classList.add("hidden");

  //const f = document.getElementById("formCard");
  //f.classList.remove("hidden");
  const modal = document.getElementById("modalOverlay");
  const f = document.getElementById("modalContent");
  modal.classList.remove("hidden");

  const common = `
  <div>
    <label>Service Name</label>
    <input name="service_name" value="${data?.[1] || ''}" required>
  </div>

  <div>
    <label>Contact</label>
    <input name="contact" value="${data?.[2] || ''}">
  </div>

  <div style="grid-column:1/-1">
    <label>Description</label>
    <textarea name="description">${data?.[data.length - 4] || ''}</textarea>
  </div>

  <div>
    <label>Photo</label>
    <input type="file" name="photo">
  </div>
`;

  let extra = "";

  if(type === "transport"){
  extra = `
    <div>
      <label>Address</label>
      <input name="address" value="${data?.[3] || ''}">
    </div>

    <div>
      <label>Transport Type</label>
      <select name="transport_type">
        <option ${data?.[4]==="Public"?"selected":""}>Public</option>
        <option ${data?.[4]==="Private"?"selected":""}>Private</option>
      </select>
    </div>

    <div>
      <label>Price per KM</label>
      <input name="price_per_km" value="${data?.[5] || ''}">
    </div>
  `;
}

  if(type === "hotel"){
  extra = `
    <div>
      <label>City</label>
      <input name="city" value="${data?.[3] || ''}">
    </div>

    <div>
      <label>Address</label>
      <input name="address" value="${data?.[4] || ''}">
    </div>

    <div>
      <label>Price</label>
      <input name="price" value="${data?.[5] || ''}">
    </div>
  `;
}

  if(type === "restaurant"){
  extra = `
    <div>
      <label>City</label>
      <input name="city" value="${data?.[3] || ''}">
    </div>

    <div>
      <label>Address</label>
      <input name="address" value="${data?.[4] || ''}">
    </div>

    <div>
      <label>Average Price</label>
      <input name="price" value="${data?.[5] || ''}">
    </div>

    <div>
      <label>Breakfast</label>
      <select name="breakfast">
        <option ${data?.[6]==="YES"?"selected":""}>YES</option>
        <option ${data?.[6]==="NO"?"selected":""}>NO</option>
      </select>
    </div>

    <div>
      <label>Lunch</label>
      <select name="lunch">
        <option ${data?.[7]==="YES"?"selected":""}>YES</option>
        <option ${data?.[7]==="NO"?"selected":""}>NO</option>
      </select>
    </div>

    <div>
      <label>Dinner</label>
      <select name="dinner">
        <option ${data?.[8]==="YES"?"selected":""}>YES</option>
        <option ${data?.[8]==="NO"?"selected":""}>NO</option>
      </select>
    </div>
  `;
}

  if(type === "guide"){
  extra = `
    <div>
      <label>Location</label>
      <input name="location" value="${data?.[3] || ''}">
    </div>

    <div>
      <label>Languages</label>
      <input name="languages" value="${data?.[4] || ''}">
    </div>
  `;
}

f.innerHTML = `
  <h3>${data ? "Edit" : "Add"} ${type}</h3>

  <form id="serviceForm">
    <div class="form-grid">
      ${common}
      ${extra}
    </div>

    <div class="form-actions" style="gap:12px">
      ${data ? `
    <button type="button" onclick="deleteService('${type}')"
      style="background:#ef4444">
      Delete Service
    </button>
  ` : ""}
  <button type="submit">Save Service</button>
</div>
  </form>
`;

document
  .getElementById("serviceForm")
  .addEventListener("submit", e => save(e, type));
}
function save(e, type){
  e.preventDefault();

  const fd = new FormData(e.target);
  fd.append("type", type);
  fd.append("email", email);

  if (editingRow !== null) {
    fd.append("row", editingRow);
  }

  fetch(API, {
    method: "POST",
    body: fd
  }).then(() => location.reload());
}
function deleteService(type){
  if (!editingRow) return;

  if (!confirm("Are you sure you want to delete this service?")) return;

  const fd = new FormData();
  fd.append("type", type);
  fd.append("email", email);
  fd.append("row", editingRow);
  fd.append("delete", "true");

  fetch(API, {
    method: "POST",
    body: fd
  }).then(() => location.reload());
}
function closeModal(){
  document.getElementById("modalOverlay").classList.add("hidden");
  editingRow = null;
}

function openProfileModal(){
  document.getElementById("profileMenu").classList.add("hidden");

  const modal = document.getElementById("modalOverlay");
  const content = document.getElementById("modalContent");

  const first_name = localStorage.getItem("userFName") || "";
  const last_name = localStorage.getItem("userLName") || "";
  const category = "Business";

  content.innerHTML = `
    <h3>My Profile</h3>

    <form>
      <div class="form-grid">
        <div>
          <label>First Name</label>
          <input value="${first_name}" disabled>
        </div>

        <div>
          <label>Last Name</label>
          <input value="${last_name}" disabled>
        </div>

        <div>
          <label>Email</label>
          <input value="${email}" disabled>
        </div>

        <div>
          <label>Account Type</label>
          <input value="${category}" disabled>
        </div>
      </div>

      <div class="form-actions">
        <button type="button" onclick="closeModal()">Close</button>
      </div>
    </form>
  `;

  modal.classList.remove("hidden");
}

</script>

</body>
</html>
